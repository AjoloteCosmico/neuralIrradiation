Entre el pulgar y el índice sostuvo con negligencia unos rectángulos rosados y amarillos,
de intrincado diseño, cuya identidad resultaba obvia. Devers así lo expresó.
-Parece dinero -dijo.
-Y lo es; el mejor dinero del Imperio, porque tiene la garantía de mis dominios, que son
más extensos que los del propio Emperador. Cien mil créditos. ¡Todos aquí, entre dos
dedos! ¡Y son suyos!
-¿A cambio de qué, señor? Soy un buen negociante, pero todos los negocios tienen dos
partes. -¿A cambio de qué? ¡De la verdad! ¿Qué persigue el general? ¿Por qué pretende
librar esa guerra? Lathan Devers suspiró y se alisó pensativamente la barba.
-¿Qué persigue? -Sus ojos seguían los movimientos de las manos del secretario mientras
contaba lentamente el dinero, billete tras billete-. En una palabra, el Imperio.
-¡Hum! ¡Qué ordinariez! Al final siempre es lo mismo. Pero ¿cómo? ¿Cuál es el camino
que lleva desde el extremo de la Galaxia hasta la cumbre del Imperio?
-La Fundación -dijo Devers con amargura- tiene sus secretos. Posee libro,, libros
antiguos, tan antiguos que su lenguaje sólo es comprendido por unos cuantos hombres
importantes. Pero los secretos están envueltos por el ritual y la religión, y nadie puede
utilizarlos. Yo lo intenté, y ahora estoy aquí... y allí me espera una sentencia de muerte.
-Comprendo. ¿Y esos antiguos secretos? Vamos, por cien mil créditos merezco que se
me den hasta los más íntimos detalles.
-La transmutación de los elementos -dijo Devers con brevedad.
El secretario entrecerró los ojos y perdió algo de su frialdad.
-Tengo entendido que la transmutación práctica es imposible, según las leyes de la
atomística.
-En efecto, si se usan fuerzas atómicas. Pero los Antiguos eran muy listos. Existen
fuentes de energía más poderosas que los átomos. Si la Fundación usara esas fuentes,
como yo sugerí...
Devers sintió una suave e insinuante sensación en el estómago. El anzuelo se
balanceaba, el pez lo estaba rondando. El secretario dijo de repente:
-Continúe. Estoy seguro de que el general sabe todo esto. Pero ¿qué se propone hacer
cuando termine esta guerra de opereta?
Devers mantuvo su voz firme como una roca. -Con la transmutación controlará . a
economía de todo su Imperio. Los yacimientos de minerales no valdrán nada cuando.
Riose pueda obtener tungsteno del aluminio e iridio del hierro. Todo el sistema de
producción basado en la escasez de ciertos elementos y la abundancia de otros quedará
totalmente superado. Se producirá la mayor catástrofe que jamás haya visto el Imperio,
y solamente Riose podrá detenerla. Además, está la cuestión de esta nueva energía que
33
he mencionado, cuyo empleo no ocasionará a Riose escrúpulos religiosos. Nada puede
detenerle ahora. Tiene a la Fundación cogida por el pescuezo, y cuando haya terminado
con ella será Emperador en dos años.
-Conque esas tenemos. -Brodrig esbozó una sonrisa-. Iridio del hierro eso dijo usted,
¿no? Voy a confiarle un secreto de estado. ¿Sabía usted que la Fundación ya ha estado
en contacto con el general? Devers se puso rígido.
-Parece sorprendido. ¿Por-qué no? Ahora resulta lógico. Le ofrecieron cien toneladas de
iridio al año a cambio de la paz. Cien toneladas de hierro convertido en iridio en violación
de sus principios religiosos para salvar sus vidas. Es justo, pero no me extraña que
nuestro incorruptible general rehusara... ¡cuando puede tener el iridio y además el
Imperio! Y el pobre Cleón le llamó su único general honrado. Mi barbudo comerciante, se
ha ganado usted este dinero.
Lo tiró al suelo, y Devers se arrodilló para recoger los billetes esparcidos.
El señor Brodrig se detuvo en la puerta y se volvió.
-Recuerde una cosa, comerciante. Mis camaradas armados no tienen oídos, ni lengua, ni
educación, ni inteligencia. No pueden oír, ni hablar, ni escribir, ni siquiera ser coherentes
con una sonda psíquica. Pero son expertos en ejecuciones muy interesantes. Yo le he
comprado a usted por cien mil créditos. Será una mercancía buena y valiosa. Si algún
día olvidase que ha sido comprado e intentase... digamos... repetir nuestra conversación
a Riose, sería ejecutado. Pero... a mi manera.
Y en aquel rostro delicado aparecieron duras líneas de ensañada crueldad que
transformaron la estudiada sonrisa en una insana mueca de labios rojos. Durante un
segundo fugaz, Devers vio al espíritu maligno del espacio que había comprado a su
sobornador.
En silencio, precedió a los «camaradas» armados de Brodrig hasta su habitación.
A la pregunta de Ducem Barr, respondió con sombría satisfacción
-No, y ésa es la parte más extraña. El me sobornó a mí.
Dos meses de guerra difícil habían dejado su huella en Bel Riose. Había en él una pesada
gravedad y se encolerizaba fácilmente.
Se dirigió con impaciencia a su incondicional sargento Luk:
-Espera fuera, soldado, y conduce a estos hombres a sus alojamientos después de que
haya hablado con ellos. Que no entre nadie hasta que yo llame. Nadie, ¿comprendes?
El sargento saludó con rigidez y abandonó la habitación, y Riose desahogó su mal humor
juntando los papeles de su mesa, tirándolos al cajón superior y cerrándolo con estrépito.
-Tomen asiento -dijo a los dos hombres-. Tengo poco tiempo. A decir verdad, no debería
estar aquí, pero necesitaba verles
Se volvió hacia Ducem Barr, cuyos largos dedos acariciaban con interés el cubo de cristal
que contenía la efigie del rostro austero de Su Majestad Imperial Cleón II.
-En primer lugar, patricio -dijo el general-, su Seldon está perdiendo. No se puede negar
que lucha bien, porque esos hombres de la Fundación acuden como insensatas abejas y
pelean como dementes. Cada planeta es defendido con furor y, una vez conquistado,
bulle de tal modo en rebeliones que resulta tan difícil mantenerlo como conquistarlo.
Pero los conquistamos y los mantenemos. Su Seldon está perdiendo...
-Aún no ha sido vencido -murmuró cortésmente Barr.
-La Fundación no es tan optimista. Me ofrecen millones para que no presente a Seldon la
batalla final.
-Así lo aseguran los rumores.
-De modo que los rumores me preceden. ¿Hablan también de la última noticia?
-¿Cuál es la última?
-Pues que el señor Brodrig, el niño mimado del Emperador, es ahora el segundo en el
mando por propia petición.
Devers habló por vez primera
-¿Por propia petición, jefe? ¿Cómo es eso? ¿O es que acaso le está resultando simpático
ese tipo? -terminó con una risita.
Riose contestó calmosamente:
-No, me temo que no. Pero ha comprado el puesto a un precio que considero justo.
-¿Cuál es?
34
-Pidiendo refuerzos al Emperador.
La sonrisa desdeñosa de Devers se acentuó. -Así pues, se ha comunicado con el
Emperador. Y supongo, jefe, que ahora está usted esperando esos refuerzos que
llegarán cualquier día de éstos. ¿Acierto?
-¡Se equivoca! Ya han llegado. Cinco naves de línea veloces y potentes, con un mensaje
personal de felicitación del Emperador y la promesa de más naves, que ya están en
camino. ¿Qué ocurre, comerciante? -preguntó con sarcasmo.
Devers habló con labios repentinamente rígidos: -¡Nada!
Riose dio la vuelta a la mesa y se detuvo frente al comerciante con la mano apoyada en
la culata de su pistola.
-Le he preguntado: ¿qué ocurre, comerciante? La noticia parece haberle trastornado.
¿Seguro que no siente un repentino interés por la Fundación? -Claro que no.
-Sí..., hay en usted cosas muy extrañas. -¿Usted cree, jefe? -Devers sonrió
forzadamente y apretó los puños en los bolsillos-. Enumérelas y se las desmentiré.
-Ahí van. Fue capturado fácilmente. Se rindió a la primera ráfaga, con el escudo
chamuscado. Está dispuesto a abandonar a su mundo, y ello sin fijar ningún precio. Todo
esto es muy interesante, ¿verdad?
-Me gusta estar del lado del vencedor, jefe. Soy un hombre sensato; usted mismo lo
dijo.
Riose replicó con voz ronca:
-¡Concedido! Sin embargo, desde entonces no ha
sido capturado ningún otro comerciante. Todas las naves comerciales son lo bastante
veloces como para escapar cuando se les antoja. Todas las naves comerciales tienen una
pantalla que les permite salir indemnes en caso de lucha. Y todos los comerciantes han
luchado hasta la muerte si la ocasión lo ha requerido. Se ha sabido que los comerciantes
son los jefes e instigadores de las guerrillas en los planetas ocupados y de las
incursiones aéreas en el espacio también ocupado. ¿Acaso es usted el único hombre
sensato? No lucha ni se escapa, y se convierte en traidor sin que se lo exijan. Es usted
peculiar, asombrosamente peculiar... yo diría que peligrosamente peculiar.
Devers dijo con voz suave:
-Comprendo lo que quiere decir, pero no tiene nada en qué basarse para efectuar una
acusación en mi contra. Ya hace seis meses que estoy aquí, y siempre me he portado
bien.
-Así es, y yo le he recompensado con un buen trato. No he tocado su nave y le he dado
todas las muestras de consideración posibles. Pero usted me ha fallado. Una información
libremente ofrecida sobre sus juguetes, por ejemplo, hubiera podido resultar de utilidad.
Los principios atómicos en los que se basan pueden ser utilizados en algunas de las más
peligrosas armas de la Fundación. ¿Me equivoco?
-Soy sólo un comerciante -repuso Devers-, y no uno de esos presuntuosos técnicos. Yo
vendo la mercancía; no la fabrico.
-Bien, pronto lo veremos. Por esa razón he venido. Por ejemplo, registraremos su nave
para saber si lleva un campo de fuerza personal. Usted nunca lo ha llevado; pero todos
los soldados de la Fundación disponen de él. Será una significativa evidencia encontrar
información que usted se niega a facilitarme. ¿No es así?
No hubo respuesta, así que continuó
-Y habrá evidencia más directa. He traído conmigo la sonda psíquica. No dio resultado la
vez anterior, pero el contacto con el enemigo es una educación liberal.
Su voz era suavemente amenazadora, y Devers sintió el cañón de un arma apretado
contra su estómago; el arma del general, que hasta aquel momento había llevado
enfundada. El general habló en voz baja:
-Se quitará su pulsera y cualquier otro ornamento de metal que lleve, y me los dará.
¡Despacio! Los campos atómicos pueden ser distorsionados, y las sondas psíquicas
podrían ahondar sólo en campos estáticos. Eso es. Démelos.
El receptor situado en la mesa del general se iluminó, y una cápsula asomó por la
ranura, cerca de donde se encontraba Barr, que seguía acariciando el busto imperial
tridimensional.
Riose se colocó detrás de la mesa, con la pistola lanzallamas apuntándoles. Dijo a Barr:
35
-Usted también, patricio. Su pulsera le condena. Sin embargo, ha sido amable
anteriormente y yo no soy vengativo, pero juzgaré el destino de su familia, retenida
como rehén, según los resultados de la sonda psíquica.
Mientras Riose se inclinaba para recoger la cápsula del mensaje, Barr levantó el busto de
cristal de Cleón y, tranquila y metódicamente, lo abatió sobre la cabeza del general.
Ocurrió demasiado aprisa para que Devers se diese cuenta. Fue como si un repentino
demonio se hubiese encarnado en el anciano.
--¡Fuera! -dijo Barr en un murmullo entre dientes-. ¡Rápido! -Cogió el lanzallamas de
Riose y se lo ocultó debajo de la camisa.
El sargento Luk se volvió cuando salieron sin apenas abrir la puerta. Barr dijo con
serenidad: -Condúzcanos, sargento.
Devers cerró la puerta tras de sí.
El sargento Luk les llevó en silencio a su alojamiento, y entonces, tras de una brevísima
pausa, continuó avanzando, pues el cañón de una pistola lanzallamas le presionaba las
costillas, mientras una voz dura murmuraba a su oído:
-A la nave comercial.
Devers se adelantó para abrir la escotilla, y Barro dijo:
-Quédese donde está, Luk. Ha sido usted un hombre decente y no vamos a matarle.
Pero el sargento reconoció el monograma de la pistola. Gritó con furia ahogada
-¡Han matado al general!
Con un alarido salvaje e incoherente, se lanzó a ciegas contra la furiosa ráfaga del arma,
y se derrumbó convertido en una ruina humana.
La nave comercial se elevaba sobre un planeta muerto cuando las señales luminosas
empezaron a parpadear contra la cremosa telaraña de la gran lente del firmamento que
era la Galaxia, y surgieron otras formas negras. Devers exclamó:
-Agárrese fuerte, Barr, y veamos si tienen alguna nave capaz de competir con mi
velocidad.
¡Sabía que no la tenían!
Y una vez en el espacio abierto, la voz del comerciante sonó perdida y muerta cuando
dijo:
-La información que di a Brodrig era demasiado buena. Me parece que sufrirá la misma
suerte del general.
Velozmente se introdujeron en las profundidades de la masa de estrellas que era la
Galaxia.
36
8. HACIA TRANTOR
Devers se inclinó sobre el pequeño globo apagado, esperando un tenue signo de vida. El
control direccional cribaba lenta y cuidadosamente el espacio con su denso y penetrante
haz de señales.
Barr vigilaba pacientemente desde su asiento en la litera baja del rincón. Preguntó:
-¿Ya no hay rastro de ellos?
-¿De los chicos del Imperio? No. -El comerciante gruñó las palabras con evidente
impaciencia. Hace mucho rato que hemos perdido a los rastreadores. ¡El espacio! Con
los brincos que hemos dado a través del hiperespacio, es una suerte que no hayamos ido
a parar a la barriga de algún sol. No podrían habernos seguido aunque hubiesen
superado
nuestra velocidad, lo cual, evidentemente, no podían hacer.
Se recostó en el respaldo y se aflojó el cuello con un brusco ademán.
-Ignoro lo que han hecho aquí esos muchachos del Imperio. Creo que algunos de los
portillos están desajustados.
-Veo que está intentando llegar a la Fundación. -Estoy llamando a la Asociación, o, al
menos, intentándolo.
-¿La Asociación? ¿Quiénes son?
-La Asociación de Comerciantes Independientes. Nunca había oído hablar de ellos,
¿verdad? Bueno, no es usted el único. Aún no nos hemos dado a conocer.
El silencio reinó durante un rato, centrado en el mudo indicador de recepción, hasta que
Barr preguntó:
-¿Estamos ya a su alcance?
-No lo sé. Tengo sólo una ligera idea de dónde nos hallamos, por cálculo aproximado.
Por eso me veo obligado a usar el control de dirección. Podríamos tardar años.
-¿En serio?
Barr hizo una seña y Devers dio un salto y se ajustó los audífonos. Había una diminuta y
luminosa blancura en la pequeña esfera opaca.
Durante media hora, Devers se ocupó del frágil hilo de comunicación que atravesaba el
hiperespacio para conectar dos puntos que la luz tardaría quinientos años en enlazar.
Al final se recostó, perdida la esperanza. Levantó la vista y se quitó los audífonos.
-Comamos, doctor. Hay una ducha que puede usar si le apetece, pero tenga cuidado con
el agua caliente.
Se puso en cuclillas ante uno de los armarios que cubrían una pared y rebuscó entre su
contenido. -Espero que no sea vegetariano.
-Como de todo -repuso Barr-. Pero ¿qué hay de la Asociación? ¿Los ha perdido?
-Así parece. Era un alcance máximo, algo excesivo. Pero no importa; recibí lo esencial.
Se enderezó y colocó sobre la mesa dos recipientes de metal.
-Espere cinco minutos, doctor, y entonces ábralo oprimiendo el contacto. Aparecerá un
plato, tenedor y comida; muy cómodo cuando se tiene prisa, si no le interesan mucho
los detalles como las servilletas. Supongo que querrá saber lo que me ha comunicado la
Asociación.
-Sí, si no es un secreto. Devers meneó la cabeza. -Para usted, no. Lo que dijo Riose era
cierto. -¿Sobre el ofrecimiento de un tributo?
-Sí. Lo ofrecieron, y se lo rechazaron. Las cosas van mal. Se pelea en los soles
exteriores de Loris. -¿Loris está cerca de la Fundación?
-¿Cómo? ¡Oh!, no sabría decírselo. Es uno de los Cuatro Reinos originales. Podría
definirlo como «parte de la línea interior de defensa». Eso no es lo peor. Se han
enfrentado a naves de tamaño inusitado, lo cual significa que Riose no estaba exagerando.
Es cierto que ha recibido más naves. Brodrig ha cambiado de bando, y yo he
armado un buen lío.
Sus ojos expresaban temor cuando juntó los dos puntos de contacto del recipiente y
contempló cómo se abría. El guisado despidió un aroma que invadió toda la cámara.
Ducem Barr ya estaba comiendo.
37
-Así pues, se acabaron las improvisaciones -dijo Barr-. Aquí no podemos hacer nada; no
podemos cruzar las líneas imperiales para volver a la Fundación; no podemos hacer otra
cosa que ser sensatos y esperar pacientemente. Sin embargo, si Riose ha llegado a la
línea interior, la espera no será demasiado larga.
Devers dejó el tenedor.
-¿Esperar? -gruñó, enfurecido-. Eso estará bien para usted, que no tiene nada en juego.
-¿Ah, no? -sonrió Barr.
-No. Voy a explicárselo. -La irritación de Devers se hizo evidente-. Estoy harto de mirar
todo este asunto bajo la lente del microscopio como si fuese un objeto interesante. Allí
tengo amigos que se están muriendo; y un mundo, mi hogar, que también se muere.
Usted es un extraño; no sabe nada de esto.
-He visto morir a amigos míos. -Las manos del anciano estaban inmóviles sobre sus
piernas, y tenía los ojos cerrados-. ¿Está usted casado?
-Los comerciantes no se casan -repuso Devers. -Pues yo tengo dos hijos y un sobrino.
Han sido advertidos, pero, por algunas razones, no han podido hacer nada. Nuestra
huida significa su muerte. Espero que mi hija y mis dos nietos hayan podido abandonar
el planeta antes de esto; pero, incluso excluyéndolos, yo he arriesgado y perdido más
que usted.
Devers replicó con crueldad:
-Lo sé, pero ha sido un caso de elección. Podría haberse quedado con Riose. Yo no le he
pedido... Barr negó con la cabeza.
-No ha sido un caso de elección, Devers. Descargue su conciencia; no he arriesgado a
mis hijos por usted. Cooperé con Riose todo el tiempo que pude. Pero estaba la sonda
psíquica.
El patricio siwenniano abrió los ojos; el dolor se reflejaba en ellos.
-Riose fue a verme en cierta ocasión, hace aproximadamente un año. Habló de un culto
centrado en los magos, pero no adivinó la verdad. No es realmente un culto. Verá ya
hace cuarenta años que Siwenna está bajo el insoportable yugo que ahora amenaza a su
mundo. Han sido sofocadas cinco rebeliones. Entonces yo descubrí los viejos archivos de
Hari Seldon, y ahora este «culto» está esperando. Espera la llegada de los «magos», y
se halla dispuesto para ese día. Mis hijos son jefes de los que esperan. Este es el secreto
que guardo en mi mente y que la sonda no debe tocar jamás. Por esta razón han de
morir como rehenes; porque la alternativa es su muerte como rebeldes, y con ellos la
muerte de medio Siwenna. Como ve, ¡no tenía elección! Y no soy ningún extraño.
Devers bajó la mirada, y Barr continuó suavemente:
-Las esperanzas de Siwenna dependen de la victoria de la Fundación. Por esa victoria se
sacrifican mis hijos. Y Hari Seldon no predice la inevitable salvación de Siwenna como
predice la de la Fundación. No poseo ninguna seguridad sobre mi pueblo... sólo
esperanza.
-Pero así y todo está dispuesto a esperar. Incluso con la Flota imperial en Loris.
-Esperaría con la misma serenidad -declaró sencillamente Barr- si hubiesen aterrizado en
el propio planeta Términus.
El comerciante frunció el ceño mientras las dudas se agolpaban en su mente.
-No sé. No puede suceder realmente así, como por arte de magia. Psicohistoria o no, son
terriblemente fuertes, y nosotros somos débiles. ¿Qué puede hacer Seldon en esto?
-No hay nada que hacer. Todo está hecho, y ahora se está realizando. El hecho de que
usted no oiga girar las ruedas ni sonar los tambores no significa que sea menos seguro.
-Tal vez; pero en estos momentos me sentiría más a gusto si de verdad hubiese
destrozado el cráneo de Riose. El es un enemigo mayor que todo su ejército.
-¿Destrozar su cráneo? ¿Con Brodrig en el mando? -El rostro de Barr se contrajo por el
odio-. Todo Siwenna hubiera sido mi rehén. Brodrig ya ha demostrado de lo que es
capaz. Existe un mundo que hace tan sólo cinco años perdió a un hombre de cada diez
por el mero hecho de no pagar sus impuestos. Brodrig era el recaudador. No, Riose
puede vivir. Sus castigos son caricias comparados con los de Brodrig.
-Pero seis meses, seis meses en la base enemiga, y no hemos conseguido nada. -Las
fuertes manos de Devers se juntaron con tanta fuerza que sus nudillos crujieron-. ¡No
hemos conseguido nada!
38
-De acuerdo, pero espere. Ahora recuerdo... -Barr rebuscó en su bolsa-. Quizá le sirva
esto. -Y puso sobre la mesa la pequeña esfera de metal. Devers la agarró.
-¿Qué es?
-La cápsula del mensaje que Riose recibió antes de que yo le golpeara. ¿No cree que tal
vez ya hayamos conseguido algo?
-Lo ignoro. ¡Depende de su contenido! -Devers se sentó y dio vueltas a la esfera
cuidadosamente. Cuando Barr salió de la ducha fría y se colocó, con agrado, bajo la
cálida corriente del secador de aire, encontró a Devers, silencioso y absorto, en el banco
de trabajo.
El siwenniano se dio rítmicas palmadas en el cuerpo y habló en voz alta para hacerse
oír:
-¿Qué hace?
Devers levantó la vista. Gotas de sudor perlaban su frente.
-Voy a abrir esta cápsula.
-¿Podrá abrirla sin la característica personal de Riose? -Había un acento de sorpresa en
la voz del siwenniano.
-Si no puedo hacerlo, me daré de baja de la Asociación y no pilotaré una nave por el
resto de mi vida. Ya tengo un triple análisis electrónico del interior, y poseo unos
pequeños utensilios de los cuales el Imperio no ha oído hablar jamás, fabricados
especialmente para cápsulas de mensajes. Verá, he sido ladrón anteriormente. Un
comerciante ha de ser un poco de todo...
Se inclinó sobre la pequeña esfera, y con un instrumento plano la tanteó delicadamente,
levantando chispas rojas a cada leve contacto. Dijo:
-Esta cápsula muestra un trabajo muy basto; los muchachos del Imperio no sirven para
cosas delicadas, se ve en seguida. ¿Ha visto alguna vez una cápsula de la Fundación?
Para empezar, su tamaño es la mitad del de ésta, y es impenetrable al análisis
electrónico.
De repente se quedó rígido; los músculos de sus hombros se contrajeron visiblemente
bajo la túnica. Su diminuta sonda presionó ligeramente...
Salió sin ruido, pero Devers se relajó y suspiró. En su mano estaba la brillante esfera con
el mensaje desenrollado como una lengua de pergamino.
-Es de Brodrig -dijo. Y luego, con desprecio-: El mensaje es permanente. En una cápsula
de la Fundación el mensaje se transformaría en gas al cabo de un minuto.
Pero Ducem Barr le hizo callar con un ademán. Leyó rápidamente el mensaje:
De: Ammel Brodrig, enviado extraordinario de Su Majestad Imperial, secretario privado
del Consejo y Par del Reino.
A: Bel Riose, gobernador militar de Siwenna, general de las Fuerzas Imperiales y Par del
Reino. Le saludo.
El planeta 1.120 ya no resiste. Los planes de ofensiva continúan según fueron
concebidos. El enemigo se debilita visiblemente y los objetivos finales serán alcanzados
con seguridad.
Barr levantó la cabeza y exclamó amargamente: -¡Idiota! ¡Maldito imbécil! ¿A eso llama
un mensaje?
-¿Cómo? -dijo Devers, vagamente decepcionado. -No dice nada -recalcó Barr-. Nuestro
pelotillero cortesano está jugando a general. Sin la presencia de Riose, es comandante
en jefe, y ha de desahogar sus pobres ánimos con pomposos informes sobre situaciones
militares que no entiende en absoluto. «Tal y tal planeta ya no resiste.» «La ofensiva
continúa.» «El enemigo se debilita.» ¡El pavo real sin cerebro!
-Bueno, bueno, espere un minuto. Lea despacio. -Tírelo. -El anciano se apartó,
exasperado-. La Galaxia sabe que no esperaba algo de importancia abrumadora, pero en
tiempos de guerra es razonable suponer que incluso la orden más rutinaria puede
dificultar los movimientos de tropas y causar complicaciones ulteriores si no se cumple.
Por eso me llevé la cápsula. Pero ¡esto! Hubiera sido mejor dejarla. Así habría hecho
perder a Riose un minuto de su tiempo, que ahora puede utilizar con fines más
constructivos.
Devers se había levantado.
39
-¿Quiere seguir leyendo y parar de bailotear? Por el amor de Seldon... -Colocó el
mensaje bajo la nariz de Barr-. Vamos, léalo de nuevo. ¿A qué se refiere con lo de
«objetivos finales»?
-A la conquista de la Fundación. ¿Por qué? -¿Usted cree? Tal vez se refiere a la conquista
del Imperio. Usted sabe que él lo considera el objetivo final.
-¿Y qué si es así?
-¡Si es así! -La torcida sonrisa de Devers se perdió entre su barba-. Vamos, preste
atención y se lo diré.
Con un dedo volvió a introducir en la ranura la diminuta hoja de pergamino ricamente
adornada con el monograma. Desapareció con un ligerísimo ruido, y el globo volvió a ser
liso y entero. En algún lugar del interior se ajustaron las engrasadas ruedecillas de sus
controles al encajar con movimientos precisos.
-Veamos, ¿verdad que no hay un sistema que permita abrir esta cápsula sin conocer la
característica personal de Riose?
-Para el Imperio, no -repuso Barr.
-Entonces, la evidencia que contiene es desconocida para nosotros y absolutamente
auténtica. -Para el Imperio, sí -dijo Barr.
-Y el Emperador puede abrirla, ¿verdad? Las características personales de los
funcionarios del Gobierno deben figurar en el archivo. Están en la Fundación.
-Y también en la capital imperial -convino Barr. -Entonces, si usted, un patricio
siwenniano y Par del Reino, dice a ese Cleón, a ese Emperador, que su loro favorito y su
más brillante general se asocian para derrocarle, y le entrega la cápsula como prueba,
¿cuáles cree que serán, en su opinión, los «objetivos finales» de Brodrig?
Barr se sentó, pues se notaba débil.
-Espere, no puedo seguirle. -Se pasó la mano por la delgada mejilla y añadió-: No está
hablando en serio, ¿verdad?
-Claro que sí. -Devers estaba excitado-. Escuche: nueve de los diez últimos emperadores
fueron degollados o sus entrañas saltaron por obra de alguno de sus generales que tenía
grandes ideas en la cabeza. Usted mismo me lo ha contado más de una vez. El bueno
del Emperador nos creería tan aprisa que a Riose le daría vueltas la cabeza.
Barr murmuró débilmente:
-Así que habla en serio. Por la Galaxia, hombre,
no pretenda resolver una crisis de Seldon con un plan tan fantástico, complicado y poco
práctico como éste. Suponga que nunca se hubiese apoderado de la cápsula. Suponga
que Brodrig no hubiera utilizado la palabra «final». Seldon no depende del azar.
-Si el azar nos sale al encuentro, no hay ley que diga que Seldon no debe aprovecharlo.
-Desde luego. Pero... -Barr se interrumpió, y después habló con calma, conteniéndose
visiblemente-. Escuche: en primer lugar, ¿cómo llegará al planeta Trántor? Ignora su
localización en el espacio y yo no recuerdo las coordenadas, y menos aún las
efemérides. Ni siquiera sabe nuestra propia posición en el espacio.
-En el espacio es imposible perderse -sonrió Devers, que ya estaba a los controles-.
Bajaremos al planeta más próximo y volveremos con las mejores cartas de navegación
que puedan comprar los cien mil créditos de Brodrig.
-Y con una ráfaga en la barriga. Nuestra descripción personal ya habrá llegado a todos
los planetas de esta parte del Imperio.
-Escuche, doctor -dijo pacientemente Devers-, no sea un aguafiestas. Riose cree que mi
nave se rindió con demasiada facilidad y, hermano, no estaba bromeando. Esta nave
tiene suficiente potencia y energía como para escapar de todo lo que encontremos a este
lado de la frontera. Y además tenemos escudos personales. Los muchachos del Imperio
no los encontraron, simplemente porque era imposible.
-Muy bien -dijo Barr-, muy bien. Imaginemos que estamos en Trántor. ¿Cómo
conseguirá ver al Emperador? ¿Cree usted que tiene horas de oficina?
-Esto ya lo pensaremos cuando estemos en Trántor -replicó Devers.
Y Barr murmuró con impotencia
-De acuerdo. Hace medio siglo que deseo ver Trántor y no quiero morir sin haberlo
hecho. Adelante con su plan.
40
Devers conectó el motor hiperatómico. Las luces relampaguearon y se produjo una ligera
sacudida interior que marcó el cambio al hiperespacio.
41
9. EN TRANTOR
Las estrellas eran tan numerosas como la mala hierba en un campo abandonado y, por
primera vez, Lathan Devers encontró que los números situados a la derecha de la coma
decimal eran de primordial importancia para calcular las órbitas a través de las
hiperregiones. Existía cierta sensación de claustrofobia en la necesidad de dar saltos no
superiores a un año luz, y una tremenda dureza en un firmamento que resplandecía
ininterrumpidamente en todas direcciones. Era como estar perdido en un mar de
radiación.
Y en el centro de un núcleo de diez mil estrellas, cuya luz rasgaba la oscuridad
circundante, giraba el enorme planeta imperial, Trántor.
Pero era más que un planeta; era el latido vivo de un imperio de veinte millones de
sistemas estelares. Tenía una sola función: la administración; un solo propósito; el
gobierno; y un solo producto manufacturado: la ley.
El mundo entero era una distorsión funcional. No había en su superficie otros objetos
vivos que el hombre, sus animales domésticos y sus parásitos. No podía encontrarse ni
una brizna de hierba ni un trozo de suelo sin cubrir fuera de los doscientos kilómetros
cuadrados que ocupaba el Palacio Imperial. Fuera del recinto de Palacio no existía más
agua que la contenida en las vastas cisternas subterráneas que suministraban el líquido
elemento a todo un mundo.
El lustroso, indestructible e incorruptible material que constituía la lisa superficie del
planeta era el cimiento de las enormes estructuras de metal que abarrotaban Trántor.
Estas estructuras estaban conectadas por aceras, unidas por corredores, divididas en
oficinas, ocupadas en su parte inferior por inmensos centros de venta al por menor que
cubrían kilómetros cuadrados, y en su parte superior por el centelleante mundo de las
diversiones, que cobraba vida todas las noches.
Era posible dar la vuelta al mundo de Trántor sin abandonar este único edificio
conglomerado ni ver la ciudad.
Una flota de naves superior en número a todas las flotillas de guerra del Imperio
descargaba diariamente en Trántor toda clase de mercancías para alimentar a los
cuarenta mil millones de seres humanos que sólo daban a cambio el cumplimiento de la
necesidad de desenredar las miríadas de hilos que convergían en la administración
central del Gobierno más complejo que la humanidad conociera jamás.
Veinte mundos agrícolas eran el granero de Trántor. Un universo era su servidor...
Fuertemente sostenida a ambos lados por enormes brazos de metal, la nave comercial
fue suavemente colocada en la gigantesca rampa que conducía al hangar. Devers había
encontrado el camino a través de las múltiples complicaciones de un mundo concebido
sobre el papel y dedicado al principio del «cuestionario por cuadriplicado..
Hicieron el alto preliminar en el espacio, donde llenaron el primero de un centenar de
cuestionarios. Hubo cien interrogatorios, la aplicación rutinaria de una sonda sencilla, la
toma de fotografías de la nave, el análisis de características de los dos hombres y su
subsiguiente registro, la búsqueda de contrabando, el pago del impuesto de entrada y,
finalmente, la cuestión de las tarjetas de identidad y el visado de estancia.
Ducem Barr era siwenniano y súbdito del Emperador, pero Lathan Devers era un
desconocido, sin los documentos necesarios. El funcionario que les atendió estaba
abrumado por aquella extraña situación, pero Devers no podía entrar. De hecho,
tendrían que retenerle para la investigación oficial.
De alguna parte brotaron cien créditos en billetes nuevos y flamantes, garantizados por
los dominios de Brodrig. El funcionario se. encogió visiblemente, y su estado de agobio
disminuyó. Apareció un nuevo impreso procedente del casillero adecuado. Fue rellenado
rápida y eficientemente, y la característica de Devers quedó estampada en él.
Los dos hombres entraron en Trántor.
En el hangar, la nave comercial fue registrada, fotografiada, anotada en el archivo; su
contenido inventariado, copiadas las tarjetas de identidad de los pasajeros y se pagó por
ella el impuesto requerido contra entrega de un recibo.
42
Y entonces Devers se encontró bajo el brillante y blanco sol, en una terraza donde había
mujeres que charlaban, niños que gritaban y hombres que sorbían lánguidamente sus
bebidas y escuchaban las noticias del Imperio emitidas por gigantescos televisores.
Barr pagó por un periódico las monedas de iridio que le pidieron. Era el Noticias
Imperiales de Trántor, órgano oficial del Gobierno. En la trastienda de la editorial sonaba
el ruido de las máquinas que imprimían ediciones extraordinarias, impulsadas desde las
oficinas del Noticias Imperiales, situadas a dieciséis mil kilómetros por corredor -a nueve
mil por avión-, del mismo modo que se imprimían simultáneamente diez millones de
ejemplares en las restantes editoriales del planeta.
Barr echó una mirada a los titulares y dijo en voz baja:
-¿Por dónde empezamos?
Devers intentó sacudirse la depresión que le embargaba. Se hallaba en un universo muy
alejado del suyo, en un mundo que le abrumaba con su complejidad, entre gentes que
hacían y decían cosas casi incomprensibles para él. Las relucientes torres metálicas que
le rodeaban y continuaban hasta el horizonte en una interminable multiplicidad, le oprimían;
la vida atareada e indiferente de la gigantesca metrópoli le sumía en una terrible
sensación de aislamiento e insignificancia.
-Eso se lo dejo a usted, doctor -contestó.
Barr estaba tranquilo. Comentó en un murmullo: -Intenté decírselo, pero es difícil de
creer si no lo ve uno mismo. Ya lo sé. ¿Adivina cuántas personas quieren ver
diariamente al Emperador? Alrededor de un millón. ¿Sabe a cuántas recibe? A unas diez.
Tendremos que tantear al servicio civil, y eso dificulta las cosas. Pero no podemos
arriesgarnos a tratar con la aristocracia.
-Tenemos casi cien mil créditos...
-Un solo Par del Reino nos costaría eso, y necesitaríamos al menos tres o cuatro para
llegar hasta el Emperador. Tal vez debamos acudir a cincuenta comisionados y
supervisores, pero sólo nos costarán unos cien créditos cada uno. Yo seré quien hable.
En primer lugar, no entenderían su acento, y, en segundo lugar, usted no conoce la
etiqueta del soborno imperial. Es todo un arte, se lo aseguro. ¡Ah!
La tercera página del Noticias Imperiales traía lo que buscaba, y pasó el periódico a
Devers.
Devers leyó con lentitud. El vocabulario era extraño, pero lo comprendió. Levantó la
vista y sus ojos delataron lo preocupado que estaba. Golpeó furiosamente la página con
el dorso de la mano. -¿Cree que podemos fiarnos de esto?
-Dentro de ciertos límites -repuso Barr con calma-. Es muy improbable que hayan
destruido la Flota de la Fundación. Seguramente ya han dado esta noticia varias veces,
si usan la acostumbrada técnica de deducir las cosas desde una capital muy alejada del
campo de batalla. Sin embargo, significa que Riose ha ganado otra contienda, lo cual no
sería de extrañar. Dicen que ha conquistado Loris. ¿No se trata del planeta-capital del
reino de Loris?
-Sí -contestó Devers-, o de lo que era el reino de Loris. Y no está ni a veinte parsecs de
la Fundación. Doctor, hemos de trabajar muy rápido.
Barr se encogió de hombros.
-No se puede ir de prisa en Trántor. Si lo intenta, lo más probable es que acabe frente al
cañón de un lanzarrayos atómico.
-¿Cuánto tiempo necesitaremos?